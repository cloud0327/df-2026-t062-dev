name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # DB を通すテスト（test/api.test.ts）のための PostgreSQL。本番の Cloud SQL と同じ 17 にそろえる
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careman"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run forms:check
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/careman
      - run: npm run build
      - name: Verify built site
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --strictPort --port 4173 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node scripts/verify-hosting.mjs http://127.0.0.1:4173 "$GITHUB_SHA"
      - name: Build and smoke-test API container
        if: github.event_name == 'pull_request'
        run: |
          docker build --platform linux/amd64 --tag t062-api:ci .
          bash scripts/smoke-api-container.sh t062-api:ci
      - name: Upload Hosting build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosting-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  deploy:
    name: Deploy Hosting
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HOSTING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: firebase-hosting-live
      queue: max
    environment:
      name: hosting-live
      url: ${{ vars.FIREBASE_HOSTING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosting-${{ github.sha }}
          path: dist/
      - name: Check latest main and build SHA
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_URL: ${{ vars.FIREBASE_HOSTING_URL }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipped an older main commit"
            exit 0
          fi
          : "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in hosting-live}"
          [[ "$FIREBASE_HOSTING_URL" =~ ^https://[a-z0-9-]+\.web\.app$ ]]
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            assert.equal(JSON.parse(readFileSync("dist/version.json", "utf8")).sha, process.env.GITHUB_SHA);
          '
          echo 'current=true' >> "$GITHUB_OUTPUT"
      - name: Publish Firebase Hosting
        if: steps.release.outputs.current == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          firebaseToolsVersion: '15.22.3'
          disableComment: true
      - name: Verify public HTTPS endpoints
        if: steps.release.outputs.current == 'true'
        env:
          HOSTING_URL: ${{ vars.FIREBASE_HOSTING_URL }}
        run: node scripts/verify-hosting.mjs "$HOSTING_URL" "$GITHUB_SHA"
