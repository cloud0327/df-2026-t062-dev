name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/gcp/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/cloud-run.yml'
      - 'scripts/release-cloud-run.sh'
      - 'scripts/smoke-api-container.sh'
      - 'test/cloud-run-release.sh'
  push:
    branches: [main]
    paths:
      - 'infra/gcp/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/cloud-run.yml'
      - 'scripts/release-cloud-run.sh'
      - 'scripts/smoke-api-container.sh'
      - 'test/cloud-run-release.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    env:
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
      - name: Verify release and rollback with local stubs
        working-directory: .
        run: |
          bash -n scripts/smoke-api-container.sh
          bash test/cloud-run-release.sh
